# SPDX-License-Identifier: AGPL-3.0-only
# Generate the Xcode project with `xcodegen generate` (or scripts/generate.sh).
name: Ptah
options:
  bundleIdPrefix: nu.khensu
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: LHS49D8RYY
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  KhensuKit:
    path: Packages/KhensuKit

targets:
  Ptah:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: KhensuKit
        product: KhensuKit
      - target: NotificationService
        destinationFilters: [iOS]
        embed: true
        codeSign: true
      - target: ShareExtension
        destinationFilters: [iOS]
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: khensu.nu
        PRODUCT_MODULE_NAME: Ptah
        PRODUCT_BUNDLE_IDENTIFIER: nu.khensu.ptah
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Support/Ptah-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/Ptah-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: khensu.nu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Elliott Wave LLC. AGPL-3.0."
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a contact's QR code or a devnet code. Nothing leaves your device.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock khensu.nu and approve changes to your identity.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: KhensuKit
        product: KhensuKit
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: khensu.nu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.nu.khensu.ptah]
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nu.khensu.ptah.notification-service
        PRODUCT_NAME: NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: KhensuKit
        product: KhensuKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: khensu.nu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.nu.khensu.ptah]
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nu.khensu.ptah.share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  Ptah:
    build:
      targets:
        Ptah: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
